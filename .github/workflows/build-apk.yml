name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: temporary-clipboard-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release and Attach APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "Temporary Clipboard APK ${{ github.ref_name || 'v1.0.0' }}"
          body: |
            ## 📱 Download Temporary Online Clipboard APK
            
            Download the pre-built Android APK directly below to test on your phone!
            
            - **Filename:** `app-debug.apk`
            - **Target:** Android 8.0+ (API 26+)
            
            ### How to Install:
            1. Tap on `app-debug.apk` below to download.
            2. Open the downloaded file on your Android device.
            3. If prompted by Android, tap **Settings** -> **Allow from this source** (or "Install unknown apps").
            4. Tap **Install** and enjoy!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
